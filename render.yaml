# Render Blueprint for the backend service. On render.com: New -> Blueprint,
# point it at this repo, and it picks this file up automatically. Every var
# below is marked sync:false so Render prompts for it in the dashboard
# instead of expecting a real secret in this file. MONGO_URI, SESSION_SECRET,
# REDIS_URL and CORS_ORIGIN are all required for the server to boot in
# production (see server.ts's own startup checks) — REDIS_URL comes from a
# separately-provisioned Redis instance (Upstash free tier, or Render's own
# Key Value add-on), not from this Blueprint.
services:
  - type: web
    name: mind-constructor-backend
    runtime: node
    rootDir: Backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
