# Behind the server's own HTTPS proxy (mind.capantcloud.eu -> :3000). The
# backend has to know the visitor came over HTTPS, or it won't send the
# sign-in cookie — pass on what the outer proxy said, and assume HTTPS when
# it said nothing (the site is only reachable through it).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      https;
}
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1m;

  # The API and live updates go to the backend container.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
  location /socket.io/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 1h;
  }

  # The service worker and manifest are always checked for a newer version.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  # Built files carry a hash in their name: cache them for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Every other path is a page of the app.
  location / {
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
