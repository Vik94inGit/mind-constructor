<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- interactive-widget=resizes-visual: on Android the on-screen keyboard
         then slides over the page (as it already does on iPhone) instead of
         shrinking it, so opening it no longer re-lays out the whole map and
         its bottom sheet, which flashed as everything jumped to the new size. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <!-- Installable app (see public/manifest.webmanifest and public/sw.js). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The paper colour of the app's own theme, set by the script below and
         by ThemeProvider. iPhone/iPad Safari paints the strip round the page
         with it, which shows for a moment while the keyboard opens; tied to
         the phone's light/dark setting instead, a dark-theme map flashed
         light there whenever the phone itself was in light mode. -->
    <meta name="theme-color" content="#f1e1cc" />
    <!-- iPhone / iPad: "Add to Home Screen" opens it full screen, with this icon and name. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mind Constructor" />
    <title>Mind Constructor</title>
    <!-- Sets the light/dark data-theme attribute before the first paint —
         ThemeProvider (src/theme/ThemeContext.tsx) keeps it in sync after
         React mounts (and is the only thing that ever changes it from
         there), but doing it here too, synchronously, means the very first
         frame already has the right theme instead of a flash of the
         opposite one while the bundle loads. Same source of truth
         ThemeProvider reads on mount: an explicit past choice in
         localStorage, else the OS preference. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("mc_theme");
        } catch (e) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#12141b" : "#f1e1cc");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Google Identity Services — renders the "Sign in with Google" button
         and issues the ID token GoogleSignInButton.tsx hands to the backend
         (POST /api/auth/google). Loaded here rather than dynamically per-
         component so it's already warm by the time Login/RegisterPage mount. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
