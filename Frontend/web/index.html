<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mind Constructor</title>
    <!-- Sets the light/dark data-theme attribute before the first paint —
         ThemeProvider (src/theme/ThemeContext.tsx) keeps it in sync after
         React mounts (and is the only thing that ever changes it from
         there), but doing it here too, synchronously, means the very first
         frame already has the right theme instead of a flash of the
         opposite one while the bundle loads. Same source of truth
         ThemeProvider reads on mount: an explicit past choice in
         localStorage, else the OS preference. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("mc_theme");
        } catch (e) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Google Identity Services — renders the "Sign in with Google" button
         and issues the ID token GoogleSignInButton.tsx hands to the backend
         (POST /api/auth/google). Loaded here rather than dynamically per-
         component so it's already warm by the time Login/RegisterPage mount. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
